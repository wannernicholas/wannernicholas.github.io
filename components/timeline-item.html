<div class="timeline-item">
  <div class="timeline-header">
    <button class="timeline-date">
      <span class="summary">{{role}} — {{company}}</span>
      <span class="dates">{{dates}}</span>
    </button>
  </div>

  <div class="timeline-content {{noImage}}">
    {{image}}
    <div class="content-text">
      <h2>{{role}}</h2>
      <h4>{{company}}</h4>
      <p>{{description}}</p>
    </div>
  </div>
</div>
